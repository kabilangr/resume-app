<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="kgr-logo-title">
  <title id="kgr-logo-title">Kabilan GR: a friendly robot head with a cyan K on its visor</title>
  <!-- "Bot visor K" (concept 3, production). Original geometry, paths and shapes only.
       Cream shell with a walnut keyline for cream pages. The inline copy in
       src/navigation/Logo.js swaps the ear and keyline colours for Brick dusk. -->
  <!-- ear pods -->
  <circle cx="8" cy="34" r="6" fill="#2b1912"/>
  <circle cx="56" cy="34" r="6" fill="#2b1912"/>
  <circle cx="8" cy="34" r="3" fill="none" stroke="#6fdcff" stroke-width="1.8"/>
  <circle cx="56" cy="34" r="3" fill="none" stroke="#6fdcff" stroke-width="1.8"/>
  <!-- head shell and chin seam -->
  <rect x="9" y="10" width="46" height="46" rx="17" fill="#f6ecdd" stroke="#2b1912" stroke-width="2.5"/>
  <path d="M22 51.5H42" fill="none" stroke="#e3d2b8" stroke-width="2" stroke-linecap="round"/>
  <!-- visor and soft gloss -->
  <rect x="15" y="19" width="34" height="28" rx="11" fill="#1a1220"/>
  <path d="M20.5 25.5C22 22.7 24.7 21.5 28 21.5" fill="none" stroke="#fffaf3" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>
  <!-- K: faint glow underlay, then the crisp stroke -->
  <path d="M26 24V42M26 34L37 24M30 30.4L38 42" fill="none" stroke="#6fdcff" stroke-opacity="0.22" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M26 24V42M26 34L37 24M30 30.4L38 42" fill="none" stroke="#6fdcff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- fairy-light indicator -->
  <circle cx="43" cy="15" r="1.9" fill="#ffcf7a"/>
</svg>
